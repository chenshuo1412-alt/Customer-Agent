[project]
name = "inbox-collector"
version = "0.1.0"
description = "Independent fail-closed inbox collector that stores review drafts. It does not send buyer messages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright==1.49.1"]

[project.scripts]
inbox-collector = "inbox_collector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inbox_collector"]

[tool.hatch.build.targets.wheel.force-include]
"mappings/pinduoduo_chat_merchant.json" = "mappings/pinduoduo_chat_merchant.json"
